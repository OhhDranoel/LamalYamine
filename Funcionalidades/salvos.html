<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.K.I.R.A - Chats Salvos</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/boxicons@2.1.1/dist/boxicons.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a1a1a; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Press Start 2P', cursive;
        }

        /* Quarto */
        .room {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to top, #2b2b2b, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Luz */
        .ambient-light {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.02), transparent 70%);
            animation: light-flicker 5s infinite alternate;
        }

        @keyframes light-flicker {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Tela de Salvos */
        .saved-chats-screen {
            position: absolute;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            text-align: center;
            width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            z-index: 2;
            border: 2px solid #F22771;
        }

        .saved-chats-screen h2 {
            font-family: 'Press Start 2P', cursive;
            color: #F22771;
            text-shadow: 2px 2px 0 #F2E52E, 0 0 10px #F22771, 0 0 20px #F22771;
            margin-bottom: 25px;
            font-size: 1.2rem;
        }

        .saved-chats-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .saved-chat-item {
            background: #333;
            border: 1px solid #F22771;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .saved-chat-item:hover {
            background: #F22771;
            color: #F2E52E;
            transform: translateX(-3px);
        }

        .saved-chat-item-text {
            flex: 1;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.8rem;
            color: #F2E52E;
        }

        .saved-chat-item-delete {
            background: #FF4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.65rem;
            font-family: 'Press Start 2P', cursive;
            transition: background 0.2s;
            margin-left: 10px;
        }

        .saved-chat-item-delete:hover {
            background: #FF6666;
        }

        .empty-saved-chats {
            color: #F2E52E;
            font-size: 0.8rem;
            padding: 40px 20px;
            opacity: 0.7;
        }

        .saved-chats-buttons {
            display: flex;
            gap: 12px;
            flex-direction: column;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            transition: background 0.3s, transform 0.1s;
        }

        .btn-home {
            background: #F2E52E;
            color: #F22771;
        }

        .btn-home:hover {
            background: #F22771;
            color: #F2E52E;
            transform: translateY(-2px);
        }

        /* Scrollbar customizado */
        .saved-chats-screen::-webkit-scrollbar {
            width: 8px;
        }

        .saved-chats-screen::-webkit-scrollbar-track {
            background: #111;
        }

        .saved-chats-screen::-webkit-scrollbar-thumb {
            background: #F22771;
            border-radius: 4px;
        }

        .saved-chats-screen::-webkit-scrollbar-thumb:hover {
            background: #F2E52E;
        }

        /* Transições suaves entre telas */
        .page-fade-out {
            animation: page-fade-out 0.38s ease forwards;
        }

        @keyframes page-fade-out {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(8px) scale(0.995); }
        }

        /* Toast */
        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #F22771;
            color: #F2E52E;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 3000;
            font-size: 0.7rem;
            font-family: 'Press Start 2P', cursive;
            transition: background 0.3s ease;
        }

        .toast.error {
            background: #FF4444;
        }

        .toast.show {
            display: block;
            animation: toast-in 0.25s ease;
        }

        @keyframes toast-in {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Modal de Confirmação */
        .confirmation-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        .confirmation-modal.show {
            display: flex;
        }

        .confirmation-modal-content {
            background: #1a1a1a;
            border: 2px solid #FF4444;
            border-radius: 8px;
            padding: 30px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .confirmation-modal h3 {
            color: #FF4444;
            font-size: 1rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #FF4444;
        }

        .confirmation-modal p {
            color: #F2E52E;
            font-size: 0.75rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .confirmation-modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .confirmation-modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65rem;
            font-weight: 600;
            transition: background 0.3s;
        }

        .confirmation-modal-btn-cancel {
            background: #F22771;
            color: #F2E52E;
        }

        .confirmation-modal-btn-cancel:hover {
            background: #F2E52E;
            color: #F22771;
        }

        .confirmation-modal-btn-confirm {
            background: #FF4444;
            color: #FFFFFF;
        }

        .confirmation-modal-btn-confirm:hover {
            background: #FF6666;
        }
    </style>
</head>
<body>
    <div class="room" id="room">
        <div class="ambient-light"></div>
        
        <div class="saved-chats-screen">
            <h2>⭐ Chats Salvos</h2>
            <div class="saved-chats-list" id="savedChatsList">
                <div class="empty-saved-chats">Nenhum chat salvo</div>
            </div>
            <div class="saved-chats-buttons">
                <button class="btn btn-home" onclick="voltarTelaInicial()">Voltar ao Menu</button>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação -->
    <div class="confirmation-modal" id="confirmationModal">
        <div class="confirmation-modal-content">
            <h3>⚠️ CONFIRMAR</h3>
            <p>Tem certeza que deseja remover este chat dos salvos?</p>
            <div class="confirmation-modal-buttons">
                <button class="confirmation-modal-btn confirmation-modal-btn-cancel" onclick="cancelDelete()">Não</button>
                <button class="confirmation-modal-btn confirmation-modal-btn-confirm" onclick="confirmDelete()">Sim</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let savedChatsData = {};
        let chatToDeleteId = null;

        // Obter chave de armazenamento do usuário logado
        function getSavedChatsKey() {
            const usuarioLogado = localStorage.getItem('usuarioLogado');
            if (!usuarioLogado) {
                return 'saved_chats_guest';
            }
            try {
                const dados = JSON.parse(usuarioLogado);
                return `saved_chats_${dados.usuario}`;
            } catch (e) {
                return 'saved_chats_guest';
            }
        }

        // Carregar chats salvos
        function loadSavedChats() {
            const key = getSavedChatsKey();
            const stored = localStorage.getItem(key);
            if (stored) {
                try {
                    savedChatsData = JSON.parse(stored);
                } catch (e) {
                    savedChatsData = {};
                }
            } else {
                savedChatsData = {};
            }
            renderSavedChats();
        }

        // Renderizar lista de chats salvos
        function renderSavedChats() {
            const chatsList = document.getElementById('savedChatsList');
            const chatsArray = Object.values(savedChatsData).sort((a, b) => new Date(b.dataSalva) - new Date(a.dataSalva));
            
            if (chatsArray.length === 0) {
                chatsList.innerHTML = '<div class="empty-saved-chats">Nenhum chat salvo ainda.<br>Clique na estrela de um chat para salvá-lo!</div>';
                return;
            }

            chatsList.innerHTML = chatsArray.map(chat => `
                <div class="saved-chat-item" onclick="abrirChatSalvo('${chat.id}')">
                    <div class="saved-chat-item-text" title="${chat.nome}">
                        ${chat.nome}
                    </div>
                    <button class="saved-chat-item-delete" onclick="event.stopPropagation(); showDeleteConfirmation('${chat.id}')">
                        Remover
                    </button>
                </div>
            `).join('');
        }

        // Mostrar confirmação de exclusão
        function showDeleteConfirmation(chatId) {
            chatToDeleteId = chatId;
            document.getElementById('confirmationModal').classList.add('show');
        }

        // Cancelar exclusão
        function cancelDelete() {
            chatToDeleteId = null;
            document.getElementById('confirmationModal').classList.remove('show');
        }

        // Confirmar exclusão
        function confirmDelete() {
            if (chatToDeleteId && savedChatsData[chatToDeleteId]) {
                delete savedChatsData[chatToDeleteId];
                const key = getSavedChatsKey();
                localStorage.setItem(key, JSON.stringify(savedChatsData));
                renderSavedChats();
                showToast('Chat removido dos salvos');
            }
            cancelDelete();
        }

        // Mostrar toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('error');
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Voltar à tela inicial
        function voltarTelaInicial() {
            const room = document.getElementById('room');
            room.classList.add('page-fade-out');
            setTimeout(() => {
                window.location.href = '../tela_inicial.html';
            }, 380);
        }

        // Abrir chat salvo (redireciona para tela inicial com chat selecionado)
        function abrirChatSalvo(chatId) {
            localStorage.setItem('chatToOpen', chatId);
            const room = document.getElementById('room');
            room.classList.add('page-fade-out');
            setTimeout(() => {
                window.location.href = '../tela_inicial.html';
            }, 380);
        }

        // Carregar chats ao abrir a página
        window.addEventListener('load', loadSavedChats);
    </script>
</body>
</html>
