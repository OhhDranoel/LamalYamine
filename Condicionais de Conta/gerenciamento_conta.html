<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>A.K.I.R.A - Gerenciamento de Conta</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a1a1a; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Press Start 2P', cursive;
        }

        /* Quarto */
        .room {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to top, #2b2b2b, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Luz */
        .ambient-light {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.02), transparent 70%);
            animation: light-flicker 5s infinite alternate;
        }

        @keyframes light-flicker {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Tela de Gerenciamento */
        .management-screen {
            position: absolute;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            text-align: center;
            width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 2;
            border: 2px solid #F22771;
        }

        .management-screen h2 {
            font-family: 'Press Start 2P', cursive;
            color: #F22771;
            text-shadow: 2px 2px 0 #F2E52E, 0 0 10px #F22771, 0 0 20px #F22771;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .user-info {
            background: #111;
            border: 2px solid #F22771;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            color: #F22771;
            font-size: 0.7rem;
        }

        .user-info p {
            margin: 10px 0;
            word-break: break-word;
        }

        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #F22771;
        }

        .section:last-child {
            border-bottom: none;
        }

        .section h3 {
            color: #F2E52E;
            font-size: 0.8rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #F2E52E;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .management-screen input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 2px solid #F22771;
            border-radius: 5px;
            background: #111;
            color: #F22771;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .management-screen button {
            flex: 1;
            background: #F22771;
            color: #F2E52E;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65rem;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        .management-screen button:hover {
            background: #F2E52E;
            color: #F22771;
        }

        .btn-logout {
            background: #F2E52E;
            color: #F22771;
        }

        .btn-logout:hover {
            background: #F22771;
            color: #F2E52E;
        }

        .btn-delete {
            background: #FF4444;
            color: #F2E52E;
        }

        .btn-delete:hover {
            background: #FF6666;
            color: #F22771;
        }

        .response-message {
            color: #F2E52E;
            margin-bottom: 15px;
            min-height: 20px;
            text-align: center;
            font-size: 0.7rem;
            padding: 10px;
            border-radius: 5px;
        }

        .response-message.error {
            color: #F22771;
            background: rgba(242, 39, 113, 0.1);
        }

        .response-message.success {
            color: #F2E52E;
            background: rgba(242, 226, 46, 0.1);
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 35px;
        }

        .password-container .eye-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #F22771;
            font-size: 0.8rem;
        }

        .password-container .eye-icon:hover {
            color: #F2E52E;
        }

        /* Scrollbar customizado */
        .management-screen::-webkit-scrollbar {
            width: 8px;
        }

        .management-screen::-webkit-scrollbar-track {
            background: #111;
        }

        .management-screen::-webkit-scrollbar-thumb {
            background: #F22771;
            border-radius: 4px;
        }

        .management-screen::-webkit-scrollbar-thumb:hover {
            background: #F2E52E;
        }

        /* Modal de Confirmação */
        .confirmation-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            animation: fade-in 0.3s ease;
        }

        .confirmation-modal.show {
            display: flex;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .confirmation-modal-content {
            background: #1a1a1a;
            border: 3px solid #FF4444;
            border-radius: 8px;
            padding: 30px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.5);
            animation: pop-in 0.3s ease;
        }

        @keyframes pop-in {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .confirmation-modal h3 {
            font-family: 'Press Start 2P', cursive;
            color: #FF4444;
            font-size: 1rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #FF4444;
        }

        .confirmation-modal p {
            color: #F2E52E;
            font-size: 0.7rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .confirmation-modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .confirmation-modal-buttons button {
            padding: 10px 25px;
            border: 2px solid #F2E52E;
            background: #1a1a1a;
            color: #F2E52E;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(242, 226, 46, 0.3);
        }

        .confirmation-modal-buttons button:hover {
            background: #F2E52E;
            color: #1a1a1a;
            box-shadow: 0 0 20px rgba(242, 226, 46, 0.8);
        }

        .btn-confirm-delete {
            border-color: #FF4444 !important;
            color: #FF4444 !important;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.3) !important;
        }

        .btn-confirm-delete:hover {
            background: #FF4444 !important;
            color: #1a1a1a !important;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.8) !important;
        }

        /* Modal de Sucesso */
        .success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 4000;
            justify-content: center;
            align-items: center;
        }

        .success-modal.show {
            display: flex;
            animation: fade-in 0.25s ease;
        }

        .success-modal-content {
            background: #071006;
            border: 3px solid #16A34A;
            border-radius: 8px;
            padding: 30px;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 0 30px rgba(22, 163, 74, 0.4);
        }

        .success-modal h3 {
            color: #16A34A;
            font-size: 1rem;
            margin-bottom: 15px;
            text-shadow: 0 0 8px #16A34A;
        }

        .success-modal p {
            color: #F2E52E;
            font-size: 0.75rem;
            margin-bottom: 20px;
        }

        .success-modal button {
            padding: 10px 25px;
            border: 2px solid #16A34A;
            background: #16A34A;
            color: #071006;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="room" id="room">
        <div class="ambient-light"></div>
        
        <!-- Tela de Gerenciamento de Conta -->
        <div class="management-screen" id="managementScreen">
            <h2>Conta</h2>
            <div id="responseMessage" class="response-message"></div>

            <!-- Informações do Usuário -->
            <div class="user-info">
                <p><strong>Usuário:</strong> <span id="usuarioDisplay">-</span></p>
                <p><strong>Email:</strong> <span id="emailDisplay">-</span></p>
            </div>

            <!-- Alternar Senha -->
            <div class="section">
                <h3>Alterar Senha</h3>
                <div class="input-group">
                    <div class="password-container">
                        <input type="password" id="senhaAtual" placeholder="Senha Atual" required>
                        <span class="eye-icon" onclick="togglePasswordVisibility(this)">👁️</span>
                    </div>
                    <div class="password-container">
                        <input type="password" id="novaSenha" placeholder="Nova Senha" required>
                        <span class="eye-icon" onclick="togglePasswordVisibility(this)">👁️</span>
                    </div>
                    <div class="password-container">
                        <input type="password" id="confirmarSenha" placeholder="Confirmar Nova Senha" required>
                        <span class="eye-icon" onclick="togglePasswordVisibility(this)">👁️</span>
                    </div>
                </div>
                <button onclick="alterarSenha()">Alterar Senha</button>
            </div>

            <!-- Alterar Email -->
            <div class="section">
                <h3>Alterar Email</h3>
                <div class="input-group">
                    <input type="email" id="novoEmail" placeholder="Novo Email" required>
                    <div class="password-container">
                        <input type="password" id="senhaEmail" placeholder="Confirme sua Senha" required>
                        <span class="eye-icon" onclick="togglePasswordVisibility(this)">👁️</span>
                    </div>
                </div>
                <button onclick="alterarEmail()">Alterar Email</button>
            </div>

            <!-- Ações -->
            <div class="section">
                <h3>Ações</h3>
                <button class="btn-logout" onclick="voltarTelaInicial()" style="width: 100%; margin-bottom: 10px;">Voltar para Tela Principal</button>
                <div class="button-group">
                    <button class="btn-logout" onclick="mudarConta()">Mudar de Conta</button>
                    <button class="btn-logout" onclick="cadastrarOutra()">Cadastrar Outra</button>
                </div>
                <button class="btn-delete" onclick="abrirConfirmacaoExcluir()" style="width: 100%; margin-top: 10px;">Excluir Conta</button>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação de Exclusão -->
    <div class="confirmation-modal" id="confirmationModal">
        <div class="confirmation-modal-content">
            <h3>⚠️ AVISO</h3>
            <p>Tem certeza que deseja excluir sua conta?</p>
            <p style="color: #FF4444; font-size: 0.65rem;">Esta ação é irreversível!</p>
            <div class="confirmation-modal-buttons">
                <button onclick="cancelarExclusao()">Não</button>
                <button class="btn-confirm-delete" onclick="confirmarExclusaoConta()">Sim</button>
            </div>
        </div>
    </div>

    <!-- Modal de Sucesso (Alterar senha / email) -->
    <div class="success-modal" id="successModal">
        <div class="success-modal-content">
            <h3 id="successModalTitle">Sucesso!</h3>
            <p id="successModalMessage">Sua operação foi realizada com sucesso.</p>
            <button onclick="fecharSucesso()">OK</button>
        </div>
    </div>

    <script>
        let usuarioAtual = '';
        let senhaAtual = '';

        // Obter dados do usuário do localStorage
        function obterDadosUsuario() {
            const usuarioLogado = localStorage.getItem('usuarioLogado');
            
            if (!usuarioLogado) {
                document.getElementById('responseMessage').textContent = 'Erro: Usuário não identificado. Faça login novamente.';
                document.getElementById('responseMessage').classList.add('error');
                setTimeout(() => {
                    window.location.href = '../Banco de Dados/login_final.html';
                }, 2000);
                return;
            }

            const dados = JSON.parse(usuarioLogado);
            usuarioAtual = dados.usuario;
            const email = dados.email;

            document.getElementById('usuarioDisplay').textContent = usuarioAtual;
            document.getElementById('emailDisplay').textContent = email || 'Não disponível';
        }

        // Mostrar mensagem de resposta (erros ou avisos curtos)
        function mostrarMensagem(texto, tipo = 'error') {
            const messageDiv = document.getElementById('responseMessage');
            messageDiv.textContent = texto;
            messageDiv.className = 'response-message ' + tipo;
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = 'response-message';
            }, 4000);
        }

        // Mostrar tela de sucesso (tela modal full-screen)
        function mostrarSucessoTela(titulo, mensagem) {
            document.getElementById('successModalTitle').textContent = titulo || 'Sucesso!';
            document.getElementById('successModalMessage').textContent = mensagem || '';
            document.getElementById('successModal').classList.add('show');
        }

        function fecharSucesso() {
            document.getElementById('successModal').classList.remove('show');
        }

        // Alternar visibilidade da senha
        function togglePasswordVisibility(icon) {
            const passwordInput = icon.previousElementSibling;
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        // Alterar Senha
        function alterarSenha() {
            const senhaAtualInput = document.getElementById('senhaAtual').value;
            const novaSenha = document.getElementById('novaSenha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            if (!senhaAtualInput || !novaSenha || !confirmarSenha) {
                mostrarMensagem('Preencha todos os campos', 'error');
                return;
            }

            if (novaSenha !== confirmarSenha) {
                mostrarMensagem('As novas senhas não coincidem', 'error');
                return;
            }

            if (novaSenha.length < 6) {
                mostrarMensagem('A senha deve ter no mínimo 6 caracteres', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('usuario', usuarioAtual);
            formData.append('acao', 'alterar_senha');
            formData.append('senha_atual', senhaAtualInput);
            formData.append('nova_senha', novaSenha);

            fetch('gerenciamento_conta.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    if (data && data.success) {
                        mostrarSucessoTela('Senha alterada', data.message || 'Senha alterada com sucesso!');
                        document.getElementById('senhaAtual').value = '';
                        document.getElementById('novaSenha').value = '';
                        document.getElementById('confirmarSenha').value = '';
                    } else {
                        mostrarMensagem((data && data.message) ? data.message : 'Erro ao alterar senha', 'error');
                    }
                } catch (e) {
                    // Se não for JSON, exibir texto limpo (evita mostrar JSON cru)
                    const trimmed = text ? text.trim() : '';
                    mostrarMensagem(trimmed || 'Erro ao alterar senha', 'error');
                }
            })
            .catch(error => {
                mostrarMensagem('Erro ao alterar senha', 'error');
            });
        }

        // Alterar Email
        function alterarEmail() {
            const novoEmail = document.getElementById('novoEmail').value;
            const senhaEmail = document.getElementById('senhaEmail').value;

            if (!novoEmail || !senhaEmail) {
                mostrarMensagem('Preencha todos os campos', 'error');
                return;
            }

            if (!novoEmail.includes('@')) {
                mostrarMensagem('Email inválido', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('usuario', usuarioAtual);
            formData.append('acao', 'alterar_email');
            formData.append('novo_email', novoEmail);
            formData.append('senha', senhaEmail);

            fetch('gerenciamento_conta.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    if (data && data.success) {
                        mostrarSucessoTela('Email alterado', data.message || 'Email alterado com sucesso!');
                        document.getElementById('emailDisplay').textContent = novoEmail;
                        document.getElementById('novoEmail').value = '';
                        document.getElementById('senhaEmail').value = '';

                        // Atualizar localStorage com o novo email
                        const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado')) || {};
                        usuarioLogado.email = novoEmail;
                        localStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado));
                    } else {
                        mostrarMensagem((data && data.message) ? data.message : 'Erro ao alterar email', 'error');
                    }
                } catch (e) {
                    const trimmed = text ? text.trim() : '';
                    mostrarMensagem(trimmed || 'Erro ao alterar email', 'error');
                }
            })
            .catch(error => {
                mostrarMensagem('Erro ao alterar email', 'error');
            });
        }

        // Excluir Conta
        function abrirConfirmacaoExcluir() {
            document.getElementById('confirmationModal').classList.add('show');
        }

        function cancelarExclusao() {
            document.getElementById('confirmationModal').classList.remove('show');
        }

        function confirmarExclusaoConta() {
            document.getElementById('confirmationModal').classList.remove('show');

            const formData = new FormData();
            formData.append('usuario', usuarioAtual);
            formData.append('acao', 'excluir_conta');

            fetch('gerenciamento_conta.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    if (data && data.success) {
                        mostrarSucessoTela('Conta excluída', data.message || 'Conta excluída com sucesso!');
                        localStorage.removeItem('usuarioLogado');
                        setTimeout(() => {
                            window.location.href = '../tela_inicial.html';
                        }, 1600);
                    } else {
                        mostrarMensagem((data && data.message) ? data.message : 'Erro ao excluir conta', 'error');
                    }
                } catch (e) {
                    const trimmed = text ? text.trim() : '';
                    mostrarMensagem(trimmed || 'Erro ao excluir conta', 'error');
                }
            })
            .catch(error => {
                mostrarMensagem('Erro ao excluir conta', 'error');
            });
        }

        // Voltar para Tela Principal
        function voltarTelaInicial() {
            window.location.href = '../tela_inicial.html';
        }

        // Mudar de Conta
        function mudarConta() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = '../Banco de Dados/login_final.html';
        }

        // Cadastrar Outra Conta
        function cadastrarOutra() {
            window.location.href = '../Banco de Dados/cadastro_final_page.html';
        }

        // Inicializar ao carregar
        window.addEventListener('load', obterDadosUsuario);
    </script>
</body>
</html>
